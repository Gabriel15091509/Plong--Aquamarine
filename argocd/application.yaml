# Point d'amorçage GitOps — appliqué une seule fois à la main :
#   kubectl apply -f argocd/application.yaml
# Ce fichier lui-même n'est PAS géré par ArgoCD (il n'est pas dans k8s/,
# qu'ArgoCD surveille). À partir de son application, ArgoCD prend le relais
# sur tout ce qui se trouve sous k8s/ (voir k8s/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plongee-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gabriel15091509/Plong--Aquamarine.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: plongee-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
