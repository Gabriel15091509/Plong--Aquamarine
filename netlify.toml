# Site Netlify pour frontend/ (monorepo : "base" cadre toutes les commandes
# et chemins ci-dessous sur ce sous-dossier). Le frontend appelle son API en
# URL relative ("/api", voir frontend/src/services/api.js) — les redirects
# ci-dessous la reproxient en interne vers la passerelle Render, exactement
# comme le fait le proxy Vite en dev (frontend/vite.config.js) : le
# navigateur ne voit jamais l'origine Render, donc aucun souci de CORS.
#
# ⚠️ Remplacer GATEWAY_URL ci-dessous par l'URL réelle du service Render
# "aquanature-gateway" une fois déployé (voir DEPLOY-RENDER-NETLIFY.md) si
# elle diffère de la valeur par défaut ci-dessous.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://aquanature-gateway.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://aquanature-gateway.onrender.com/uploads/:splat"
  status = 200
  force = true

# Fallback SPA (React Router) : doit rester la dernière règle, sinon elle
# capte les deux redirects ci-dessus avant qu'ils ne s'appliquent.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
