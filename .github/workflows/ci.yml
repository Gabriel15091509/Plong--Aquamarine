name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.value }}
      frontend: ${{ steps.filter.outputs.frontend }}
      short_sha: ${{ steps.sha.outputs.value }}
    steps:
      # fetch-depth: 0 (historique complet) est nécessaire ici : par défaut
      # actions/checkout ne récupère que le dernier commit, et quand un push
      # groupe plusieurs commits, dorny/paths-filter ne peut alors pas
      # comparer avec `github.event.before` (absent du clone superficiel) —
      # il retombe silencieusement sur une comparaison au commit précédent
      # seulement, ratant les changements des commits plus anciens du même
      # push (bug vérifié : un push de 4 commits touchant `frontend/**` a vu
      # `build-frontend` marqué "skipped").
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway-service: backend/gateway-service/**
            formation-service: backend/formation-service/**
            materiel-service: backend/materiel-service/**
            finance-service: backend/finance-service/**
            vie-associative-service: backend/vie-associative-service/**
            identite-service: backend/identite-service/**
            activites-service: backend/activites-service/**
            frontend: frontend/**
      - id: services
        # `changes` agrège TOUS les filtres définis ci-dessus, y compris
        # `frontend` (job dédié `build-frontend` plus bas) — on l'exclut ici
        # pour que la matrice `build` ne reçoive que des services backend.
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: echo "value=$(echo "$CHANGES" | jq -c 'map(select(. != "frontend"))')" >> "$GITHUB_OUTPUT"
      - id: sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: backend/${{ matrix.service }}
        run: npm run lint

      - name: Test
        working-directory: backend/${{ matrix.service }}
        run: npm test

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/${{ matrix.service }}:sha-${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.IMAGE_NS }}/${{ matrix.service }}:main
          # Labels OCI standard : identifient sans ambiguïté, dans GHCR et via
          # `docker inspect`, quel microservice et quel commit ont produit
          # cette image précise — utile pour le suivi par service en démo.
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Microservice ${{ matrix.service }} (Plongée Aquamarine)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ needs.detect-changes.outputs.short_sha }}

      - name: Scan image (advisory only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NS }}/${{ matrix.service }}:sha-${{ needs.detect-changes.outputs.short_sha }}
          severity: CRITICAL
          exit-code: "0"
          format: table

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Pas de gate lint/test ici : `npm run lint` du frontend n'a jamais eu
      # de config ESLint fonctionnelle (204 erreurs préexistantes découvertes
      # en l'ajoutant, hors périmètre de ce chantier) et il n'existe aucun
      # test. Le `docker build` ci-dessous exécute `vite build`, qui est le
      # seul vrai gate disponible aujourd'hui (échoue si le bundle ne compile
      # pas).

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/frontend:sha-${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.IMAGE_NS }}/frontend:main
          labels: |
            org.opencontainers.image.title=frontend
            org.opencontainers.image.description=Frontend web (Plongée Aquamarine)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ needs.detect-changes.outputs.short_sha }}

      - name: Scan image (advisory only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NS }}/frontend:sha-${{ needs.detect-changes.outputs.short_sha }}
          severity: CRITICAL
          exit-code: "0"
          format: table

  update-manifests:
    needs: [detect-changes, build, build-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs['build-frontend'].result == 'success' || needs['build-frontend'].result == 'skipped') &&
      (needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp

      - name: Bump image tags in k8s/kustomization.yaml
        working-directory: k8s
        run: |
          # La clé passée à `kustomize edit set image` doit être le nom
          # COMPLET de l'image (celui déjà écrit dans le littéral `image:`
          # de chaque manifest), pas le nom court du service — sinon
          # l'entrée `images:` ne matche jamais rien à la résolution
          # (kustomize compare par égalité exacte, sans normalisation) et
          # le bump est un no-op silencieux.
          for svc in $(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]'); do
            /tmp/kustomize edit set image "${{ env.IMAGE_NS }}/${svc}=${{ env.IMAGE_NS }}/${svc}:sha-${{ needs.detect-changes.outputs.short_sha }}"
          done
          if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            /tmp/kustomize edit set image "${{ env.IMAGE_NS }}/frontend=${{ env.IMAGE_NS }}/frontend:sha-${{ needs.detect-changes.outputs.short_sha }}"
          fi

      - name: Commit and push
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git commit -m "chore(gitops): bump image tag(s) to sha-${{ needs.detect-changes.outputs.short_sha }} [skip ci]"

          # Deux workflows déclenchés par des push rapprochés sur main
          # arrivent régulièrement à ce point en même temps : celui qui pousse
          # en second se fait rejeter (non-fast-forward) puisque l'autre a
          # déjà avancé main entre-temps. On rebase le commit de bump sur le
          # main le plus récent et on retente, plutôt que d'échouer tout le
          # workflow pour une collision bénigne sur un fichier généré.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $attempt/5), rebase sur origin/main puis nouvelle tentative..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done

          echo "Échec du push après plusieurs tentatives"
          exit 1
