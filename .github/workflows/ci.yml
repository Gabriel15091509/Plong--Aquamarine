name: CI

on:
  # `feature/**` : lint/tests/build/scan à chaque push, feedback rapide,
  # sans jamais toucher au GitOps (e2e-smoke et update-manifests restent
  # conditionnés à `github.ref == 'refs/heads/main'` plus bas). Le merge
  # dans `main` déclenche en plus la promotion staging→E2E→prod.
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.value }}
      frontend: ${{ steps.filter.outputs.frontend }}
      short_sha: ${{ steps.sha.outputs.value }}
    steps:
      # fetch-depth: 0 (historique complet) est nécessaire ici : par défaut
      # actions/checkout ne récupère que le dernier commit, et quand un push
      # groupe plusieurs commits, dorny/paths-filter ne peut alors pas
      # comparer avec `github.event.before` (absent du clone superficiel) —
      # il retombe silencieusement sur une comparaison au commit précédent
      # seulement, ratant les changements des commits plus anciens du même
      # push (bug vérifié : un push de 4 commits touchant `frontend/**` a vu
      # `build-frontend` marqué "skipped").
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway-service: backend/gateway-service/**
            formation-service: backend/formation-service/**
            materiel-service: backend/materiel-service/**
            finance-service: backend/finance-service/**
            vie-associative-service: backend/vie-associative-service/**
            identite-service: backend/identite-service/**
            activites-service: backend/activites-service/**
            frontend: frontend/**
      - id: services
        # `changes` agrège TOUS les filtres définis ci-dessus, y compris
        # `frontend` (job dédié `build-frontend` plus bas) — on l'exclut ici
        # pour que la matrice `build` ne reçoive que des services backend.
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: echo "value=$(echo "$CHANGES" | jq -c 'map(select(. != "frontend"))')" >> "$GITHUB_OUTPUT"
      - id: sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    # Présent pour toute la matrice mais seul activites-service s'en sert
    # aujourd'hui (tests d'intégration Supertest sur les routes Sortie) —
    # coût négligeable pour les autres services, qui n'ouvrent aucune
    # connexion DB dans leurs tests actuels (validation pure + /health).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plongee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: plongee_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # N'a d'effet que pour activites-service (seul consommateur DB ci-
      # dessous) — les autres services ignorent cette variable.
      DB_SCHEMA: activites
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: backend/${{ matrix.service }}
        run: npm run lint

      # Ce projet ne gère pas son schéma via `sequelize.sync()` en dev/prod
      # (voir scripts/migrate-*.sql, tous incrémentaux sur une base déjà
      # migrée depuis l'ancien monolithe — aucun n'est utilisable pour
      # créer une base neuve). Ce script, réservé à la CI, reconstruit le
      # schéma `activites` à partir des modèles Sequelize actuels sur le
      # Postgres éphémère ci-dessus, pour que les tests d'intégration aient
      # une vraie base à interroger.
      - name: Bootstrap test database schema (activites-service)
        if: matrix.service == 'activites-service'
        working-directory: backend/activites-service
        run: node scripts/ci-bootstrap-schema.js

      # activites-service a une vraie séparation unit/intégration (scripts
      # dédiés, cf. package.json) — étapes visibles séparément pour que
      # l'UI Actions montre clairement quel niveau échoue. Les 6 autres
      # services n'ont pour l'instant que de la validation pure + /health
      # dans un seul dossier tests/, d'où un unique step "Unit & health
      # tests" pour eux.
      - name: Unit tests
        if: matrix.service == 'activites-service'
        working-directory: backend/activites-service
        run: npm run test:unit

      - name: Integration tests
        if: matrix.service == 'activites-service'
        working-directory: backend/activites-service
        run: npm run test:integration

      - name: Unit & health tests
        if: matrix.service != 'activites-service'
        working-directory: backend/${{ matrix.service }}
        run: npm test

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          # Cache de couches par service (clé par matrix.service, sinon tous
          # les services backend écraseraient le même cache `gha` faute de
          # scope) : les couches `npm ci` ne sont reconstruites que si
          # package-lock.json change, pas à chaque commit.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_NS }}/${{ matrix.service }}:sha-${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.IMAGE_NS }}/${{ matrix.service }}:main
          # Labels OCI standard : identifient sans ambiguïté, dans GHCR et via
          # `docker inspect`, quel microservice et quel commit ont produit
          # cette image précise — utile pour le suivi par service en démo.
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Microservice ${{ matrix.service }} (Plongée Aquamarine)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ needs.detect-changes.outputs.short_sha }}

      - name: Scan image (advisory only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NS }}/${{ matrix.service }}:sha-${{ needs.detect-changes.outputs.short_sha }}
          severity: CRITICAL
          exit-code: "0"
          format: table

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` refuse ce lock file : eslint (ajv@6) et workbox-build (ajv@8,
      # via @apideck/better-ajv-errors) d'une part, tailwind (picomatch@2) et
      # vite-plugin-pwa (picomatch@4, via tinyglobby/fdir) d'autre part,
      # cohabitent en hoisted avec un dédup que `npm ls`/`npm ci` signalent
      # "invalid" alors qu'il est inoffensif à l'exécution (chaque module
      # retrouve la bonne version en remontant l'arbre node_modules). Testé :
      # `--install-strategy=nested` élimine le signalement mais casse la
      # résolution de `workbox-window` au build. `npm install` tolère ce
      # dédup sans y toucher.
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # Toujours pas de gate lint ici : `npm run lint` du frontend n'a jamais
      # eu de config ESLint fonctionnelle (204 erreurs préexistantes
      # découvertes en l'ajoutant, hors périmètre de ce chantier). En
      # revanche des tests Vitest existent désormais (composants + utils) —
      # gate ajouté.
      - name: Test
        working-directory: frontend
        run: npm test

      # Le `docker build` ci-dessous exécute en plus `vite build`, qui reste
      # le seul gate sur la compilation du bundle.

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.IMAGE_NS }}/frontend:sha-${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.IMAGE_NS }}/frontend:main
          labels: |
            org.opencontainers.image.title=frontend
            org.opencontainers.image.description=Frontend web (Plongée Aquamarine)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ needs.detect-changes.outputs.short_sha }}

      - name: Scan image (advisory only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NS }}/frontend:sha-${{ needs.detect-changes.outputs.short_sha }}
          severity: CRITICAL
          exit-code: "0"
          format: table

  e2e-smoke:
    # Test système : stack complète (7 services backend + frontend) contre
    # un Postgres éphémère, données de démo réelles, parcours utilisateur
    # réel piloté par Playwright. Volontairement réservé à `main` (coûteux :
    # ~7 services Node + build frontend + navigateur headless) plutôt que
    # sur chaque PR — c'est un smoke test pré-déploiement, pas un gate de
    # revue de code.
    needs: [detect-changes, build, build-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plongee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `concurrently` (pour `npm run dev` plus bas) et `@playwright/test`
      # sont des devDependencies de CE package.json racine, jamais installées
      # par `install:backend` (qui ne fait que `npm --prefix backend/X
      # install` pour chaque service, sans toucher au node_modules racine).
      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm run install:backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # activites-service, finance-service, identite-service, materiel-
      # service et vie-associative-service n'ont pas de .env committé
      # (gitignored, comme il se doit) — on part de leur .env.example, dont
      # PORT/DB_SCHEMA/*_SERVICE_URL sont déjà corrects pour un lancement
      # tout-en-local (mêmes valeurs que docker-compose.yml). Les secrets
      # ("change_me") sont sans conséquence : DB_PASSWORD et JWT_SECRET
      # sont réécrits juste après par les variables d'environnement du job,
      # qui priment sur le contenu du fichier .env (dotenv ne réécrase
      # jamais une variable déjà présente dans process.env). formation-
      # service et gateway-service gardent leur .env déjà committé tel
      # quel, pour la même raison.
      - name: Generate .env for services without a committed one
        run: |
          for s in activites finance identite materiel vie-associative; do
            cp "backend/${s}-service/.env.example" "backend/${s}-service/.env"
          done

      # Aucun des scripts scripts/migrate-*.sql n'est utilisable pour créer
      # une base neuve (tous incrémentaux sur une base déjà migrée depuis
      # l'ancien monolithe) — on reconstruit donc chaque schéma à partir des
      # modèles Sequelize actuels, comme pour activites-service dans le job
      # "build" ci-dessus.
      - name: Bootstrap all service schemas
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: plongee_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          cd backend/identite-service && DB_SCHEMA=identite node scripts/ci-bootstrap-schema.js && cd ../..
          cd backend/activites-service && DB_SCHEMA=activites node scripts/ci-bootstrap-schema.js && cd ../..
          cd backend/formation-service && DB_SCHEMA=formation node scripts/ci-bootstrap-schema.js && cd ../..
          cd backend/materiel-service && DB_SCHEMA=materiel node scripts/ci-bootstrap-schema.js && cd ../..
          cd backend/finance-service && DB_SCHEMA=finance node scripts/ci-bootstrap-schema.js && cd ../..
          cd backend/vie-associative-service && DB_SCHEMA=vie_associative node scripts/ci-bootstrap-schema.js && cd ../..

      # Démarrage sur base VIDE (le seed a lieu après, une fois les services
      # en ligne) : au boot, chaque service exécute un premier passage
      # immédiat de ses alertes (retards matériel, rappels sortie...) —
      # sur une base vide ce passage est instantané, alors qu'avec des
      # données déjà en place il tenterait de vrais envois d'email avec les
      # identifiants placeholder de .env.example (échec silencieux mais
      # lent, cf. try/catch par destinataire dans SortieService.envoyerRappels).
      - name: Start backend stack
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: plongee_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-not-for-production
        run: nohup npm run dev > /tmp/backend.log 2>&1 &

      - name: Wait for backend services to be healthy
        run: |
          for port in 5000 5010 5011 5012 5013 5014 5015; do
            echo "Waiting for port $port..."
            for i in $(seq 1 60); do
              curl -sf "http://localhost:$port/health" > /dev/null && break
              sleep 2
              if [ "$i" -eq 60 ]; then
                echo "::error::Service on port $port never became healthy"
                tail -n 200 /tmp/backend.log
                exit 1
              fi
            done
          done

      # Mêmes surcharges DB que le bootstrap : sans elles, chaque script
      # relit le DB_PASSWORD de son propre .env (le placeholder "change_me"
      # généré plus haut, ou le vrai mot de passe de dev pour formation-
      # service/gateway-service dont le .env est committé) — aucun des
      # deux ne correspond au Postgres éphémère de ce job.
      - name: Seed demo data
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: plongee_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          (cd backend/identite-service && node scripts/seedIdentite.js)
          (cd backend/materiel-service && node scripts/seedMateriel.js)
          (cd backend/activites-service && node scripts/seedActivites.js)
          (cd backend/formation-service && node scripts/seedFormation.js)
          (cd backend/finance-service && node scripts/seedFinance.js)
          (cd backend/vie-associative-service && node scripts/seedVieAssociative.js)
          (cd backend/materiel-service && node scripts/syncLocalisation.js)

      - name: Build and preview frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npx vite preview --port 3000 --host > /tmp/frontend.log 2>&1 &

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Frontend never became ready"
          tail -n 200 /tmp/frontend.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: /tmp/backend.log
          retention-days: 14

  # Promotion échelonnée (staging d'abord, prod seulement après un E2E
  # vert) : deux jobs distincts plutôt qu'un seul, précisément parce
  # qu'ils ne doivent PAS se déclencher au même moment — voir le job
  # `update-manifests-production` plus bas pour le gate. Les runners
  # GitHub Actions n'ayant aucune route réseau vers le cluster Docker
  # Desktop local, ce gate est encodé dans Git (quel tag chaque overlay
  # référence), pas via un appel à l'API ArgoCD.
  update-manifests-staging:
    needs: [detect-changes, build, build-frontend]
    # Ne dépend PLUS de la réussite de la totalité du matrix `build` : avec
    # `fail-fast: false`, un seul service en échec (ex. lint cassé sur
    # gateway-service) fait passer `needs.build.result` à "failure" pour
    # TOUT le job, alors même que les autres services de la matrice ont fini
    # leur build/push avec succès. Ça a déjà fait sauter ce step entièrement
    # une fois, laissant 6 images fraîches poussées sur GHCR mais jamais
    # référencées dans kustomization.yaml, donc jamais déployées par ArgoCD.
    # On tourne désormais toujours (si quelque chose a changé) et on vérifie
    # image par image, juste avant de la bumper (step suivant), qu'elle a
    # bien été poussée.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp

      - name: Bump image tags in k8s/overlays/staging/kustomization.yaml
        working-directory: k8s/overlays/staging
        run: |
          # La clé passée à `kustomize edit set image` doit être le nom
          # COMPLET de l'image (celui déjà écrit dans le littéral `image:`
          # de chaque manifest), pas le nom court du service — sinon
          # l'entrée `images:` ne matche jamais rien à la résolution
          # (kustomize compare par égalité exacte, sans normalisation) et
          # le bump est un no-op silencieux.
          #
          # Chaque service est vérifié individuellement (`docker manifest
          # inspect`) avant d'être bumpé : si son build a échoué dans cette
          # run, l'image sha-<courte> n'existe pas sur GHCR, et on le saute
          # (avec un avertissement) plutôt que d'écrire un tag inexistant ou
          # de bloquer le bump des autres services qui, eux, ont réussi.
          bump_if_pushed() {
            local svc="$1"
            local image="${{ env.IMAGE_NS }}/${svc}:sha-${{ needs.detect-changes.outputs.short_sha }}"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              /tmp/kustomize edit set image "${{ env.IMAGE_NS }}/${svc}=${image}"
            else
              echo "::warning::Image absente sur GHCR pour ${svc} (${image}) — build probablement en échec dans cette run, tag conservé."
            fi
          }

          for svc in $(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]'); do
            bump_if_pushed "$svc"
          done
          if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            bump_if_pushed "frontend"
          fi

      - name: Commit and push
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git commit -m "chore(gitops): bump staging image tag(s) to sha-${{ needs.detect-changes.outputs.short_sha }} [skip ci]"

          # Deux workflows déclenchés par des push rapprochés sur main
          # arrivent régulièrement à ce point en même temps : celui qui pousse
          # en second se fait rejeter (non-fast-forward) puisque l'autre a
          # déjà avancé main entre-temps. On rebase le commit de bump sur le
          # main le plus récent et on retente, plutôt que d'échouer tout le
          # workflow pour une collision bénigne sur un fichier généré.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $attempt/5), rebase sur origin/main puis nouvelle tentative..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done

          echo "Échec du push après plusieurs tentatives"
          exit 1

  # Ne bumpe k8s/base/kustomization.yaml (source des tags de PROD) que si
  # le E2E de ce même run a réussi — c'est le gate de promotion demandé.
  # `needs.e2e-smoke.result` vaut "skipped" (donc ≠ "success") si e2e-smoke
  # n'a pas tourné (ex. build en échec) : prod n'avance pas non plus dans
  # ce cas, comme attendu.
  update-manifests-production:
    needs: [detect-changes, build, build-frontend, e2e-smoke]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.e2e-smoke.result == 'success' &&
      (needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp

      - name: Bump image tags in k8s/base/kustomization.yaml
        working-directory: k8s/base
        run: |
          # Voir le commentaire équivalent dans update-manifests-staging :
          # même logique, appliquée ici à la base (source des tags de prod).
          bump_if_pushed() {
            local svc="$1"
            local image="${{ env.IMAGE_NS }}/${svc}:sha-${{ needs.detect-changes.outputs.short_sha }}"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              /tmp/kustomize edit set image "${{ env.IMAGE_NS }}/${svc}=${image}"
            else
              echo "::warning::Image absente sur GHCR pour ${svc} (${image}) — build probablement en échec dans cette run, tag conservé."
            fi
          }

          for svc in $(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]'); do
            bump_if_pushed "$svc"
          done
          if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            bump_if_pushed "frontend"
          fi

      - name: Commit and push
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git commit -m "chore(gitops): bump production image tag(s) to sha-${{ needs.detect-changes.outputs.short_sha }} [skip ci]"

          # Voir le commentaire équivalent dans update-manifests-staging :
          # même logique de retry/rebase en cas de push rejeté.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $attempt/5), rebase sur origin/main puis nouvelle tentative..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done

          echo "Échec du push après plusieurs tentatives"
          exit 1
