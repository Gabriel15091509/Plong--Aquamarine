name: Keep-alive backend Render

# Tous les services backend sont sur le plan Render "free" (voir render.yaml,
# plan: free partout) : Render endort un service web gratuit après 15 min
# sans requête HTTP, et le réveil (cold start) prend alors 20 à 30+ secondes
# — vérifié en direct sur les 7 services (identite/formation/materiel/
# finance/vie-associative/activites/gateway) : ~22-33s à froid, ~1-1.5s une
# fois réveillés. Le dashboard interroge en parallèle la quasi-totalité de
# ces services (stats + tendances + indicateurs) : si l'appli n'a pas été
# utilisée depuis plus de 15 min, TOUS sont endormis en même temps et son
# temps de chargement est celui du plus lent à se réveiller.
#
# Ce workflow ping périodiquement `/health` (route déjà déclarée comme
# healthCheckPath dans render.yaml, donc déjà surveillée par Render
# lui-même — on ne fait qu'ajouter du trafic externe régulier) sur chaque
# service pour qu'aucun n'atteigne jamais 15 minutes d'inactivité tant que
# ce cron continue de tourner. Ne remplace pas un vrai plan payant (aucune
# garantie que GitHub Actions déclenche `schedule` à l'heure pile, et un
# schedule sur un repo public est automatiquement désactivé après 60 jours
# sans aucun commit) — mais coût nul, suffisant pour une démo/usage courant.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - aquanature-gateway
          - aquanature-identite
          - aquanature-activites
          - aquanature-formation
          - aquanature-materiel
          - aquanature-finance
          - aquanature-vie-associative
    steps:
      - name: Ping ${{ matrix.service }}/health
        # --max-time large (le cold start peut dépasser 30s) ; --retry pour
        # absorber un DNS/TLS raté isolé sans faire échouer inutilement le
        # job (l'objectif est de maintenir le service éveillé, pas de tester
        # sa disponibilité — pas d'alerte à lever ici en cas d'échec ponctuel).
        run: |
          curl --fail --silent --show-error \
            --max-time 60 --retry 2 --retry-delay 5 \
            "https://${{ matrix.service }}.onrender.com/health"
