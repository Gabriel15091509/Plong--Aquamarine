# Gabarit — copier en k8s/secret.yaml (déjà gitignoré) et remplacer les
# valeurs avant `kubectl apply -f k8s/secret.yaml`. Ne jamais committer le
# fichier rempli.
apiVersion: v1
kind: Secret
metadata:
  name: plongee-secrets
  namespace: plongee-app
type: Opaque
stringData:
  DB_PASSWORD: change_me
  JWT_SECRET: change_me
  EMAIL_USER: change_me
  EMAIL_PASSWORD: change_me
  # Clé AES-256 (32 octets encodés en base64) chiffrant les certificats
  # médicaux au repos (vie-associative-service). Générer avec :
  # openssl rand -base64 32
  CERTIFICAT_ENCRYPTION_KEY: change_me
  # API Groq (gratuite, console.groq.com) — assistant conversationnel
  # (gateway-service) et validation automatique de documents d'adhésion/
  # certificats médicaux (vie-associative-service). Sans clé valide, les deux
  # circuits dégradent proprement (voir leurs groqClient.js respectifs) au
  # lieu d'échouer.
  GROQ_API_KEY: change_me
  # Compte OVH SMS (manager OVH > SMS > créer un compte) pour les alertes
  # SMS de dernière minute (vie-associative-service). Sans eux, l'envoi
  # dégrade proprement en simulation (voir utils/smsClient.js).
  OVH_SMS_ACCOUNT: change_me
  OVH_SMS_LOGIN: change_me
  OVH_SMS_PASSWORD: change_me
