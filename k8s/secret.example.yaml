# Gabarit — copier en k8s/secret.yaml (déjà gitignoré) et remplacer les
# valeurs avant `kubectl apply -f k8s/secret.yaml`. Ne jamais committer le
# fichier rempli.
apiVersion: v1
kind: Secret
metadata:
  name: plongee-secrets
  namespace: plongee-app
type: Opaque
stringData:
  DB_PASSWORD: change_me
  JWT_SECRET: change_me
  EMAIL_USER: change_me
  EMAIL_PASSWORD: change_me
