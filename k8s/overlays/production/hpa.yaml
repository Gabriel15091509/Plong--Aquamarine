# Autoscaling horizontal (production) : min=2, max=8 réplicas par service,
# déclenché à 70% d'utilisation CPU moyenne. Nécessite metrics-server sur
# le cluster (voir DEPLOY.md) et des `resources.requests` sur les
# conteneurs — injectées par le patch de kustomization.yaml, la base n'en
# définit pas.
#
# Pas de `behavior.scaleDown` accéléré ici (contrairement à
# ../staging/hpa.yaml, réglé à 30s pour que les démos restent lisibles) :
# le défaut Kubernetes (5 min de stabilisation avant de retirer des
# réplicas) est le comportement anti-oscillation approprié face à du vrai
# trafic.
#
# identite-service, materiel-service et vie-associative-service montent
# chacun un volume ReadWriteOnce (uploads sur disque) — voir la même
# remarque dans ../staging/hpa.yaml sur les limites de RWO en cluster
# multi-nœuds (non applicable ici, cluster à un seul nœud).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
