apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plongee-app

resources:
- ../../base
- namespace.yaml
- 08-ingress.yaml
- 12-postgres-backup.yaml
- hpa.yaml
- 17-ingress-public.yaml
- 18-tailscale-funnel.yaml
  # secret.yaml n'est jamais listé ici : le Secret réel reste appliqué à la
  # main (kubectl apply -f k8s/secret.yaml, gitignoré) et hors de portée
  # d'ArgoCD (jamais tracké, donc jamais pruné/recréé par lui).
  # Même règle pour le Secret OAuth de l'opérateur Tailscale
  # (namespace tailscale, jamais dans ce dépôt) — voir DEPLOY.md section 10.

# Les tags d'image sont réécrits dans ../../base/kustomization.yaml, mais
# SEULEMENT après un E2E vert (job CI "update-manifests-production") —
# ../staging/ a son propre bloc `images:`, bumpé plus tôt et
# indépendamment (job "update-manifests-staging"). Voir la section 9 de
# DEPLOY.md pour le détail du gate de promotion.

# Réplicas de départ à 2 (= minReplicas des HPA de hpa.yaml) : sans ce
# bloc, le premier sync ArgoCD après l'ajout du HPA scale brutalement de 1
# à 2 sans que ce soit piloté par le HPA lui-même (même raison que
# ../staging/kustomization.yaml).
replicas:
- name: gateway-service
  count: 2
- name: formation-service
  count: 2
- name: materiel-service
  count: 2
- name: finance-service
  count: 2
- name: vie-associative-service
  count: 2
- name: identite-service
  count: 2
- name: activites-service
  count: 2
- name: frontend
  count: 2

# Le HPA a besoin de `resources.requests.cpu` sur les conteneurs pour
# calculer un pourcentage d'utilisation — la base n'en définit pas (même
# raison que ../staging/kustomization.yaml). Valeurs un cran au-dessus de
# celles de staging : la production doit absorber du vrai trafic, pas
# juste démarrer.
patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 384Mi
# Le nœud (Docker Desktop, un seul nœud, ~7,7Gi de RAM allouable partagés
# avec staging + ArgoCD + cert-manager + Prometheus×2) tourne déjà à ~85%
# des requests mémoire une fois le HPA monté en charge (jusqu'à 8 réplicas
# sur certains services). Le rolling update par défaut (maxSurge 25%) a
# besoin de programmer un pod EN PLUS le temps du remplacement — sur ce
# nœud ça se traduit par un "Insufficient memory" transitoire pendant les
# déploiements (observé concrètement sur frontend). maxSurge:0 fait un
# remplacement pod-par-pod (jamais de pod supplémentaire à caser), au prix
# d'un bref passage à N-1 réplicas au lieu de N+1 — acceptable puisque
# minReplicas=2 garantit qu'il en reste toujours au moins 1 disponible.
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
