apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plongee-app

resources:
- ../../base
- namespace.yaml
- 08-ingress.yaml
- 12-postgres-backup.yaml
  # secret.yaml n'est jamais listé ici : le Secret réel reste appliqué à la
  # main (kubectl apply -f k8s/secret.yaml, gitignoré) et hors de portée
  # d'ArgoCD (jamais tracké, donc jamais pruné/recréé par lui).

# Les tags d'image sont réécrits dans ../../base/kustomization.yaml (source
# unique pour production ET staging — même artefact promu dans les deux
# environnements). Le job CI "update-manifests" cible ce fichier-là
# directement, pas celui-ci.
