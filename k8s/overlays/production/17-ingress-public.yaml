# Ingress "public" (Phase 6 — accès depuis internet, tous rôles) : mêmes
# routes que 08-ingress.yaml (parité complète, y compris finance/matériel/
# gestion des comptes), servies par un DEUXIÈME contrôleur ingress-nginx
# totalement séparé (classe `nginx-public`, installé via Helm — voir
# DEPLOY.md section 10), pas celui de 08-ingress.yaml (classe `nginx`,
# accès réseau local du club).
#
# Ouvert à tous les rôles (pas seulement adhérent) à la demande explicite
# du 2026-08-13 — l'isolation réseau initiale (routes admin non
# exposables même en forgeant le Host) est donc levée : la protection de
# ces routes repose désormais entièrement sur l'authentification/RBAC
# applicative (JWT + contrôle de rôle par endpoint), plus sur l'isolation
# réseau. Si ce choix doit être révisé, retirer simplement les routes
# admin ci-dessous (paiements, échéanciers, matériel, réparations,
# users/moniteurs/président/trésoriers, attributions).
#
# Pourquoi un deuxième contrôleur plutôt qu'un Ingress de plus sur le
# même contrôleur que 08-ingress.yaml : celui-ci reste local uniquement
# (pas de LoadBalancer/NodePort exposé), donc même en cas d'oubli de
# routes ici, rien ne fuit par ce biais — le contrôleur `nginx-public`
# ClusterIP n'est atteignable que par le pod de l'opérateur Tailscale, via
# Funnel (voir 18-tailscale-funnel.yaml). Aucun cert TLS ici : Tailscale
# termine le HTTPS public lui-même et reparle en clair à l'intérieur du
# cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plongee-ingress-public
  namespace: plongee-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx-public
  rules:
    - http:
        paths:
          - path: /api/formations
            pathType: Prefix
            backend:
              service: { name: formation-service, port: { number: 5010 } }
          - path: /api/competences
            pathType: Prefix
            backend:
              service: { name: formation-service, port: { number: 5010 } }
          - path: /api/seances
            pathType: Prefix
            backend:
              service: { name: formation-service, port: { number: 5010 } }
          - path: /api/specialites-formation
            pathType: Prefix
            backend:
              service: { name: formation-service, port: { number: 5010 } }
          - path: /api/materiels
            pathType: Prefix
            backend:
              service: { name: materiel-service, port: { number: 5011 } }
          - path: /api/reparations
            pathType: Prefix
            backend:
              service: { name: materiel-service, port: { number: 5011 } }
          - path: /uploads/materiels
            pathType: Prefix
            backend:
              service: { name: materiel-service, port: { number: 5011 } }
          - path: /api/paiements
            pathType: Prefix
            backend:
              service: { name: finance-service, port: { number: 5012 } }
          - path: /api/echeanciers
            pathType: Prefix
            backend:
              service: { name: finance-service, port: { number: 5012 } }
          - path: /api/adhesions
            pathType: Prefix
            backend:
              service: { name: vie-associative-service, port: { number: 5013 } }
          - path: /api/certificats-medicaux
            pathType: Prefix
            backend:
              service: { name: vie-associative-service, port: { number: 5013 } }
          - path: /uploads/adhesions
            pathType: Prefix
            backend:
              service: { name: vie-associative-service, port: { number: 5013 } }
          - path: /uploads/certificats
            pathType: Prefix
            backend:
              service: { name: vie-associative-service, port: { number: 5013 } }
          - path: /api/alertes
            pathType: Prefix
            backend:
              service: { name: vie-associative-service, port: { number: 5013 } }
          - path: /api/auth
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /api/adherents
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /api/users
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /api/moniteurs
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /api/president
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /api/tresoriers
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /uploads/avatars
            pathType: Prefix
            backend:
              service: { name: identite-service, port: { number: 5014 } }
          - path: /api/sorties
            pathType: Prefix
            backend:
              service: { name: activites-service, port: { number: 5015 } }
          - path: /api/inscriptions
            pathType: Prefix
            backend:
              service: { name: activites-service, port: { number: 5015 } }
          - path: /api/plongees
            pathType: Prefix
            backend:
              service: { name: activites-service, port: { number: 5015 } }
          - path: /api/palanquees
            pathType: Prefix
            backend:
              service: { name: activites-service, port: { number: 5015 } }
          - path: /api/attributions
            pathType: Prefix
            backend:
              service: { name: activites-service, port: { number: 5015 } }
          - path: /api/incidents
            pathType: Prefix
            backend:
              service: { name: activites-service, port: { number: 5015 } }
          - path: /api/dashboard
            pathType: Prefix
            backend:
              service: { name: gateway-service, port: { number: 5000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
