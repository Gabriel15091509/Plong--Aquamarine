# Autoscaling horizontal (staging uniquement) : min=1, max=3 réplicas par
# service, déclenché à 70% d'utilisation CPU moyenne. Nécessite
# metrics-server sur le cluster (voir DEPLOY.md) et des `resources.requests`
# sur les conteneurs — injectées par le patch de kustomization.yaml, la base
# n'en définit pas.
#
# identite-service, materiel-service et vie-associative-service montent
# chacun un volume ReadWriteOnce (uploads sur disque). Sur ce cluster
# Docker Desktop (un seul nœud), plusieurs réplicas peuvent monter le même
# volume RWO sans erreur de scheduling — mais en cluster multi-nœuds, ce
# serait un point de blocage classique (RWO = un seul nœud à la fois).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 1
  maxReplicas: 3
  behavior:
    # Délai par défaut avant scale-down : 5 min (anti-oscillation). Réduit
    # à 30s ici pour que les démos restent lisibles — à ne pas copier tel
    # quel sur un vrai environnement de production à fort trafic.
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
