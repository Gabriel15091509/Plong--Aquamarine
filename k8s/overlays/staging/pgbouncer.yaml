# PgBouncer (staging uniquement pour l'instant — voir Phase 4 du plan) :
# pool de connexions devant Postgres. Nécessaire dès que le HPA multiplie
# les réplicas Node (chacun avec pool.max=10 dans config/database.js) :
# à max=3 réplicas × 7 services avec accès DB × 10 = jusqu'à 210 connexions
# simultanées possibles, à comparer aux ~100 connexions par défaut de
# postgres:16-alpine.
#
# Image edoburu/pgbouncer (bitnami/pgbouncer n'a plus de tag public
# gratuit sur Docker Hub, vérifié au moment d'écrire ceci — passé derrière
# leur registre payant). Tag épinglé (`v1.25.2-p0`, vérifié disponible via
# l'API Docker Hub) plutôt que `latest`, par cohérence avec le reste du
# projet (toutes les images applicatives utilisent des tags `sha-`
# immuables, jamais `latest`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels: { app: pgbouncer }
  template:
    metadata:
      labels: { app: pgbouncer }
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_PORT } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: plongee-secrets, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_NAME } }
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "200"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: AUTH_TYPE
              value: scram-sha-256
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector: { app: pgbouncer }
  ports:
    - port: 5432
      targetPort: 5432
