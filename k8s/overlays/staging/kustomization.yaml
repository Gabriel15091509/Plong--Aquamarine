apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plongee-app-staging

resources:
- ../../base
- namespace.yaml
- hpa.yaml
  # pgbouncer.yaml : promu dans ../../base (k8s/base/13-pgbouncer.yaml)
  # après validation ici — plus besoin de le lister à part.
  # Pas d'ingress ni de sauvegarde automatique ici : staging n'est joignable
  # qu'en interne au cluster (kubectl port-forward), jamais exposé via le
  # nom de domaine public/TLS de production (voir overlays/production/).
  # secret.yaml : même principe qu'en production, appliqué à la main dans
  # CE namespace (kubectl apply -f k8s/secret.yaml -n plongee-app-staging
  # après avoir corrigé metadata.namespace dans la copie locale).

# Tags d'image PROPRES à staging (redéclare et écrase ceux de ../../base,
# kustomize applique le transformer `images:` de l'overlay en dernier) :
# la CI bump ce fichier-ci immédiatement après le build, AVANT le E2E,
# tandis que ../../base/kustomization.yaml (source des tags de prod)
# n'est bumpé qu'après un E2E vert — voir le job `update-manifests-*` de
# .github/workflows/ci.yml. Valeurs de départ identiques à la base, elles
# divergeront ensuite au fil des déploiements.
images:
- name: ghcr.io/gabriel15091509/plong--aquamarine/activites-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/activites-service
  newTag: sha-4dfcf37
- name: ghcr.io/gabriel15091509/plong--aquamarine/finance-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/finance-service
  newTag: sha-2ae5e6f
- name: ghcr.io/gabriel15091509/plong--aquamarine/formation-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/formation-service
  newTag: sha-2ae5e6f
- name: ghcr.io/gabriel15091509/plong--aquamarine/frontend
  newName: ghcr.io/gabriel15091509/plong--aquamarine/frontend
  newTag: sha-53cd7fc
- name: ghcr.io/gabriel15091509/plong--aquamarine/gateway-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/gateway-service
  newTag: sha-b0f11ff
- name: ghcr.io/gabriel15091509/plong--aquamarine/identite-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/identite-service
  newTag: sha-897577a
- name: ghcr.io/gabriel15091509/plong--aquamarine/materiel-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/materiel-service
  newTag: sha-2ae5e6f
- name: ghcr.io/gabriel15091509/plong--aquamarine/vie-associative-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/vie-associative-service
  newTag: sha-f64d086

# Réplicas de départ à 1 (= minReplicas des HPA ci-dessus) ; le HPA prend
# ensuite la main entre 1 et 3 selon la charge CPU.
replicas:
- count: 1
  name: gateway-service
- count: 1
  name: formation-service
- count: 1
  name: materiel-service
- count: 1
  name: finance-service
- count: 1
  name: vie-associative-service
- count: 1
  name: identite-service
- count: 1
  name: activites-service
- count: 1
  name: frontend

# Le HPA a besoin de `resources.requests.cpu` sur les conteneurs pour
# calculer un pourcentage d'utilisation — la base n'en définit pas
# (production tourne sans limites depuis le début, on ne change pas ce
# comportement pour ne pas modifier le profil de ressources de prod).
# Valeurs modestes, cohérentes avec des microservices Node.js légers sur un
# cluster Docker Desktop local.
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
  target:
    kind: Deployment
