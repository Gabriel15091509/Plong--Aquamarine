# Sauvegarde quotidienne de la base (exigence 4.3 : sauvegarde automatique
# quotidienne). pg_dump s'exécute dans un pod éphémère, à distance, contre le
# Service `postgres` — pas besoin d'un accès exec au pod StatefulSet. Les
# dumps sont conservés 30 jours glissants (les données elles-mêmes ne sont
# jamais purgées ailleurs dans le système, ce qui couvre à part la rétention
# 5 ans exigée sur les données ; ce CronJob ne fait que garantir un point de
# restauration récent, pas un historique de 5 ans de dumps).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: plongee-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: plongee-app
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGHOST
                  valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_HOST } }
                - name: PGPORT
                  valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_PORT } }
                - name: PGDATABASE
                  valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_NAME } }
                - name: PGUSER
                  valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_USER } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: plongee-secrets, key: DB_PASSWORD } }
              command:
                - sh
                - -c
                - |
                  set -eu
                  mkdir -p /backups
                  fichier="/backups/plongee_db_$(date +%Y-%m-%d_%H%M%S).sql.gz"
                  tmp="${fichier}.tmp"

                  # Le pipeline `pg_dump | gzip > fichier` masquait un pg_dump en
                  # échec : gzip réussit quand même sur une entrée vide, donc le
                  # Job se déclarait "réussi" avec un fichier de ~20 octets — 5
                  # échecs sur 7 exécutions sont passés inaperçus ainsi (DNS
                  # transitoire vers le Service "postgres", CoreDNS a redémarré
                  # 13 fois en 15 jours sur ce cluster local). On sépare donc les
                  # deux étapes pour vérifier explicitement le code retour de
                  # pg_dump, avec quelques tentatives pour absorber une
                  # résolution DNS momentanément indisponible.
                  reussi=0
                  for tentative in 1 2 3 4 5; do
                    if pg_dump > "$tmp"; then
                      reussi=1
                      break
                    fi
                    echo "pg_dump a échoué (tentative $tentative/5), nouvel essai dans 10s..." >&2
                    rm -f "$tmp"
                    sleep 10
                  done

                  if [ "$reussi" -ne 1 ]; then
                    echo "Échec de la sauvegarde après 5 tentatives" >&2
                    exit 1
                  fi

                  gzip -c "$tmp" > "$fichier"
                  rm -f "$tmp"
                  echo "Sauvegarde créée : $fichier"
                  find /backups -name '*.sql.gz' -mtime +30 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: postgres-backup-pvc }
