# Passerelle unique du frontend (baseURL unique `/api/...`) — reproduit
# exactement la table de préfixes de monolith/src/routes/index.js. Nécessite
# le contrôleur nginx-ingress activé sur le cluster local
# (`minikube addons enable ingress`, ou l'ingress-nginx par défaut de kind).
# Aucune réécriture de chemin : chaque backend (monolithe ou microservice)
# monte déjà ses routes sous `/api`, donc le chemin d'origine est transmis
# tel quel.
#
# Chaque domaine migré gagne sa propre règle ici et perd son relais interne
# dans la passerelle (voir backend/gateway-service/src/middlewares/proxyTo.js)
# — seul `/api/dashboard` reste servi directement par `gateway-service`
# (agrégation HTTP jamais migrée vers un microservice dédié). Le `/`
# générique sert désormais le frontend statique (k8s/11-frontend.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plongee-ingress
  namespace: plongee-app
  annotations:
    # Défaut ingress-nginx (1m) < MAX_FILE_SIZE des uploads (5 Mo, voir
    # backend/identite-service/src/middlewares/upload.js et l'équivalent
    # vie-associative-service) : sans ce réglage, l'Ingress rejette la
    # requête (413) avant même qu'elle n'atteigne le service.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # HTTPS (exigence 4.4 / accès club) : certificat Let's Encrypt réel via
    # DNS-01 sur un sous-domaine DuckDNS gratuit (voir cert-manager +
    # cert-manager-duckdns-webhook, namespace cert-manager), le serveur
    # restant joignable uniquement depuis le réseau local du club (aucune
    # redirection de port depuis l'extérieur). ssl-redirect désactivé pour
    # ne pas casser l'accès existant en http://localhost (pas de certificat
    # pour cet hôte-là).
    cert-manager.io/cluster-issuer: duckdns-letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plongee-club.duckdns.org
      secretName: plongee-club-tls
  rules:
    - http:
        paths:
          - path: /api/formations
            pathType: Prefix
            backend:
              service:
                name: formation-service
                port: { number: 5010 }
          - path: /api/competences
            pathType: Prefix
            backend:
              service:
                name: formation-service
                port: { number: 5010 }
          - path: /api/seances
            pathType: Prefix
            backend:
              service:
                name: formation-service
                port: { number: 5010 }
          - path: /api/specialites-formation
            pathType: Prefix
            backend:
              service:
                name: formation-service
                port: { number: 5010 }
          - path: /api/materiels
            pathType: Prefix
            backend:
              service:
                name: materiel-service
                port: { number: 5011 }
          - path: /api/reparations
            pathType: Prefix
            backend:
              service:
                name: materiel-service
                port: { number: 5011 }
          - path: /api/paiements
            pathType: Prefix
            backend:
              service:
                name: finance-service
                port: { number: 5012 }
          - path: /api/echeanciers
            pathType: Prefix
            backend:
              service:
                name: finance-service
                port: { number: 5012 }
          - path: /api/adhesions
            pathType: Prefix
            backend:
