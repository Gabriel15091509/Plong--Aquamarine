- name: ghcr.io/gabriel15091509/plong--aquamarine/gateway-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/gateway-service
  newTag: sha-b0f11ff
- name: ghcr.io/gabriel15091509/plong--aquamarine/identite-service
