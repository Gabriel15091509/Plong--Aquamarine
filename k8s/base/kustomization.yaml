apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plongee-app

# Socle commun aux deux environnements (production ET staging, voir
# ../overlays/) : namespace, ingress et sauvegarde automatique sont
# spécifiques à chaque environnement et vivent dans leur overlay respectif,
# pas ici.
resources:
- 02-postgres.yaml
- 03-gateway-service.yaml
- 04-formation-service.yaml
- 05-materiel-service.yaml
- 06-finance-service.yaml
- 07-vie-associative-service.yaml
- 09-identite-service.yaml
- 10-activites-service.yaml
- 11-frontend.yaml
- 13-pgbouncer.yaml
- 14-prometheus.yaml
  # secret.yaml n'est jamais listé ici : le Secret réel reste appliqué à la
  # main (kubectl apply -f k8s/secret.yaml -n <namespace>, gitignoré) et
  # hors de portée d'ArgoCD (jamais tracké, donc jamais pruné/recréé par
  # lui) — dans chaque environnement.

# `plongee-config` généré (au lieu d'un ConfigMap statique dans resources:,
# voir git blame) : constaté le 2026-08-14, un changement de contenu seul
# (ex. PRESIDENT_2FA_DISABLED) laissait les pods déjà démarrés avec leurs
# anciennes variables d'env — un ConfigMap appliqué "en place" ne redéclenche
# aucun rollout, les 7 services le consomment via `envFrom.configMapRef` lu
# une seule fois au démarrage du conteneur. Un générateur suffixe le nom
# avec un hash du contenu (plongee-config-<hash>) ; kustomize réécrit
# automatiquement toutes les références (configMapRef/configMapKeyRef, base
# et overlays) vers ce nouveau nom à chaque `build` — le nom qui change fait
# partie du pod template, donc CHAQUE modification de plongee-config.env
# déclenche désormais un rolling restart normal des services concernés,
# sans étape manuelle à se souvenir de faire.
configMapGenerator:
- envs:
  - plongee-config.env
  name: plongee-config

# IMPORTANT : `name:` doit être le chemin COMPLET de l'image tel qu'écrit
# dans le littéral `image:` de chaque manifest (ghcr.io/.../<service>), pas
# le nom court du service — kustomize ne matche que sur une égalité exacte
# du nom d'image, sans normalisation. Un `name:` court ne matche jamais rien
# et le littéral du manifest reste inchangé (bug vérifié : avec un `name:`
# court, `kubectl kustomize k8s` continue de résoudre `:main` quel que soit
# `newTag:`). Le workflow CI (.github/workflows/ci.yml, job
# update-manifests) doit utiliser ce même chemin complet comme clé de
# `kustomize edit set image`.
images:
- name: ghcr.io/gabriel15091509/plong--aquamarine/activites-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/activites-service
  newTag: sha-1896dd3
- name: ghcr.io/gabriel15091509/plong--aquamarine/finance-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/finance-service
  newTag: sha-95d9019
- name: ghcr.io/gabriel15091509/plong--aquamarine/formation-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/formation-service
  newTag: sha-a334047
- name: ghcr.io/gabriel15091509/plong--aquamarine/frontend
  newName: ghcr.io/gabriel15091509/plong--aquamarine/frontend
