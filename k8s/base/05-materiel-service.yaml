# Photos de matériel uploadées — PVC dédié, comme `identite-uploads-pvc`
# (voir 09-identite-service.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: materiel-uploads-pvc
  namespace: plongee-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: materiel-service
  namespace: plongee-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: materiel-service }
  template:
    metadata:
      labels: { app: materiel-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5011" }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: materiel-service
          # Référence littérale de secours (kubectl apply -f direct, sans
          # kustomize) — en usage normal, k8s/kustomization.yaml réécrit ce
          # champ vers ghcr.io/.../materiel-service:sha-<shortsha> à chaque
          # déploiement GitOps (voir DEPLOY.md).
          image: ghcr.io/gabriel15091509/plong--aquamarine/materiel-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5011
          env:
            - name: DB_SCHEMA
              value: materiel
          envFrom:
            - configMapRef: { name: plongee-config }
            - secretRef: { name: plongee-secrets }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health, port: 5011 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: materiel-uploads-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: materiel-service
  namespace: plongee-app
spec:
  selector: { app: materiel-service }
  ports:
    - port: 5011
      targetPort: 5011
