# Prometheus minimal (Phase 5) : un Prometheus par environnement (déployé
# une fois par overlay, comme postgres/pgbouncer), pas de Grafana ni
# d'Alertmanager dans ce lot — cluster déjà sous tension (CoreDNS a
# redémarré 13 fois en 15 jours, un pull d'image a mis 8 min). Les
# alertes sont visibles dans l'UI Prometheus (/alerts), sans routage.
#
# Cibles statiques (`static_configs`) plutôt que la découverte Kubernetes
# habituelle (`kubernetes_sd_configs`) : volontaire, pas une simplification
# hâtive — la découverte K8s demanderait soit un ClusterRole (portée
# cluster entière, dupliqué par overlay pour éviter que les deux
# Applications ArgoCD ne se disputent la même ressource cluster-scope —
# déjà vécu ce jour avec un autre changement, coûteux), soit un Role
# namespacé dont la valeur de restriction par namespace n'est pas
# templatable proprement en pur Kustomize. Les noms courts des 7 Services
# (résolus par CoreDNS DANS le namespace courant, comme le fait déjà
# plongee-config pour les URLs inter-services) donnent une isolation par
# environnement gratuite, sans RBAC du tout.
#
# Limite assumée : chaque cible est le Service (ClusterIP), pas les pods
# individuellement — avec plusieurs réplicas (HPA), un scrape donné
# n'atteint qu'UN SEUL pod à la fois (kube-proxy), pas l'ensemble. Pour
# une alerte de latence à cette échelle (démo/petit club), l'approximation
# est jugée suffisante ; une vraie granularité par pod demanderait la
# découverte K8s ci-dessus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: plongee-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - gateway-service:5000
              - formation-service:5010
              - materiel-service:5011
              - finance-service:5012
              - vie-associative-service:5013
              - identite-service:5014
              - activites-service:5015
  rules.yml: |
    groups:
      - name: plongee-app
        rules:
          # AlerteService vit dans vie-associative-service — cible
          # concrète demandée : latence p95 sur les routes /api/alertes.
          - alert: AlerteServiceHighLatency
            expr: >
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{instance="vie-associative-service:5013", route=~"/api/alertes.*"}[5m])) by (le)
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latence élevée sur AlerteService (vie-associative-service)"
              description: "p95 des requêtes /api/alertes au-dessus de 2s depuis 5 minutes."
          - alert: AlerteServiceHighErrorRate
            expr: >
              sum(rate(http_request_duration_seconds_count{instance="vie-associative-service:5013", route=~"/api/alertes.*", status_code=~"5.."}[5m]))
              /
              sum(rate(http_request_duration_seconds_count{instance="vie-associative-service:5013", route=~"/api/alertes.*"}[5m]))
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Taux d'erreur élevé sur AlerteService (vie-associative-service)"
              description: "Plus de 5% de réponses 5xx sur /api/alertes depuis 5 minutes."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Rétention courte : cluster local, espace disque limité — pas
            # besoin d'un historique long pour une démo/alerte en direct.
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
