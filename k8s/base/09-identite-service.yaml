# Photos de profil (tous rôles) uploadées — PVC dédié, comme
# `vie-associative-uploads-pvc` (voir 07-vie-associative-service.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identite-uploads-pvc
  namespace: plongee-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identite-service
  namespace: plongee-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: identite-service }
  template:
    metadata:
      labels: { app: identite-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5014" }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: identite-service
          # Référence littérale de secours (kubectl apply -f direct, sans
          # kustomize) — en usage normal, k8s/kustomization.yaml réécrit ce
          # champ vers ghcr.io/.../identite-service:sha-<shortsha> à chaque
          # déploiement GitOps (voir DEPLOY.md).
          image: ghcr.io/gabriel15091509/plong--aquamarine/identite-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5014
          env:
            - name: DB_SCHEMA
              value: identite
          envFrom:
            - configMapRef: { name: plongee-config }
            - secretRef: { name: plongee-secrets }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health, port: 5014 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: identite-uploads-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: identite-service
  namespace: plongee-app
spec:
  selector: { app: identite-service }
  ports:
    - port: 5014
      targetPort: 5014
