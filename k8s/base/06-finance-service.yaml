apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
  namespace: plongee-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: finance-service }
  template:
    metadata:
      labels: { app: finance-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5012" }
    spec:
      containers:
        - name: finance-service
          # Référence littérale de secours (kubectl apply -f direct, sans
          # kustomize) — en usage normal, k8s/kustomization.yaml réécrit ce
          # champ vers ghcr.io/.../finance-service:sha-<shortsha> à chaque
          # déploiement GitOps (voir DEPLOY.md).
          image: ghcr.io/gabriel15091509/plong--aquamarine/finance-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5012
          env:
            - name: DB_SCHEMA
              value: finance
          envFrom:
            - configMapRef: { name: plongee-config }
            - secretRef: { name: plongee-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 5012 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
  namespace: plongee-app
spec:
  selector: { app: finance-service }
  ports:
    - port: 5012
      targetPort: 5012
