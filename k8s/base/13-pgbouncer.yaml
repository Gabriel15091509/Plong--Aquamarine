# PgBouncer : pool de connexions devant Postgres, partagé par les deux
# environnements (voir ../overlays/{production,staging}/kustomization.yaml
# pour les `resources.requests` injectées par patch — prérequis HPA,
# absent ici par design). Validé d'abord en staging seul avant promotion
# ici (transaction multi-requêtes réelle testée avec succès en
# pool_mode=transaction : BEGIN/INSERT/INSERT/SELECT/COMMIT sur la même
# connexion serveur). Nécessaire dès que le HPA multiplie les réplicas
# Node (chacun avec pool.max=10 dans config/database.js) : en production,
# max=8 réplicas × 7 services avec accès DB × 10 = jusqu'à 560 connexions
# simultanées possibles, très au-dessus des ~100 connexions par défaut de
# postgres:16-alpine.
#
# Image edoburu/pgbouncer (bitnami/pgbouncer n'a plus de tag public
# gratuit sur Docker Hub, vérifié au moment d'écrire ceci — passé derrière
# leur registre payant). Tag épinglé (`v1.25.2-p0`, vérifié disponible via
# l'API Docker Hub) plutôt que `latest`, par cohérence avec le reste du
# projet (toutes les images applicatives utilisent des tags `sha-`
# immuables, jamais `latest`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels: { app: pgbouncer }
  template:
    metadata:
      labels: { app: pgbouncer }
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_PORT } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: plongee-secrets, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: plongee-config, key: DB_NAME } }
            - name: POOL_MODE
              value: transaction
            # 500 : couvre le pic théorique en production (max=8 réplicas
            # × 7 services × pool.max=10 = 560 connexions "logiques" côté
            # app), avec de la marge côté staging (max=3 réplicas). Un
            # seul réglage pour les deux environnements plutôt qu'un
            # patch par overlay — default_pool_size, lui, n'a pas besoin
            # de suivre : en pool_mode=transaction, un petit nombre de
            # connexions réelles suffit à servir beaucoup plus de clients
            # (chacun ne retient sa connexion que le temps d'une seule
            # transaction).
            - name: MAX_CLIENT_CONN
              value: "500"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: AUTH_TYPE
              value: scram-sha-256
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector: { app: pgbouncer }
  ports:
    - port: 5432
      targetPort: 5432
