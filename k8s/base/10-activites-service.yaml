apiVersion: apps/v1
kind: Deployment
metadata:
  name: activites-service
  namespace: plongee-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: activites-service }
  template:
    metadata:
      labels: { app: activites-service }
    spec:
      containers:
        - name: activites-service
          # Référence littérale de secours (kubectl apply -f direct, sans
          # kustomize) — en usage normal, k8s/kustomization.yaml réécrit ce
          # champ vers ghcr.io/.../activites-service:sha-<shortsha> à chaque
          # déploiement GitOps (voir DEPLOY.md).
          image: ghcr.io/gabriel15091509/plong--aquamarine/activites-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5015
          env:
            - name: DB_SCHEMA
              value: activites
          envFrom:
            - configMapRef: { name: plongee-config }
            - secretRef: { name: plongee-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 5015 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: activites-service
  namespace: plongee-app
spec:
  selector: { app: activites-service }
  ports:
    - port: 5015
      targetPort: 5015
