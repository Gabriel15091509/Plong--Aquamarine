apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plongee-app

resources:
- 00-namespace.yaml
- 01-configmap.yaml
- 02-postgres.yaml
- 03-gateway-service.yaml
- 04-formation-service.yaml
- 05-materiel-service.yaml
- 06-finance-service.yaml
- 07-vie-associative-service.yaml
- 09-identite-service.yaml
- 10-activites-service.yaml
- 11-frontend.yaml
- 08-ingress.yaml
  # secret.yaml n'est jamais listé ici : le Secret réel reste appliqué à la
  # main (kubectl apply -f k8s/secret.yaml, gitignoré) et hors de portée
  # d'ArgoCD (jamais tracké, donc jamais pruné/recréé par lui).

# IMPORTANT : `name:` doit être le chemin COMPLET de l'image tel qu'écrit
# dans le littéral `image:` de chaque manifest (ghcr.io/.../<service>), pas
# le nom court du service — kustomize ne matche que sur une égalité exacte
# du nom d'image, sans normalisation. Un `name:` court ne matche jamais rien
# et le littéral du manifest reste inchangé (bug vérifié : avec un `name:`
# court, `kubectl kustomize k8s` continue de résoudre `:main` quel que soit
# `newTag:`). Le workflow CI (.github/workflows/ci.yml, job
# update-manifests) doit utiliser ce même chemin complet comme clé de
# `kustomize edit set image`.
images:
- name: ghcr.io/gabriel15091509/plong--aquamarine/activites-service
  newName: ghcr.io/gabriel15091509/plong--aquamarine/activites-service
  newTag: sha-35e993a
