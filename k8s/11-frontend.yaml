# Frontend (Vite/React, servi en statique par nginx non-root). Sert
# uniquement les fichiers statiques : les appels /api/* et /uploads/*
# n'atteignent jamais ce pod, l'Ingress les route directement vers le
# microservice propriétaire (voir k8s/08-ingress.yaml). Ce conteneur ne
# reçoit que le "/" générique, en dernier recours de la table de routage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: plongee-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # Référence littérale de secours (kubectl apply -f direct, sans
          # kustomize) — en usage normal, k8s/kustomization.yaml réécrit ce
          # champ vers ghcr.io/.../frontend:sha-<shortsha> à chaque
          # déploiement GitOps (voir DEPLOY.md).
          image: ghcr.io/gabriel15091509/plong--aquamarine/frontend:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: plongee-app
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 8080
